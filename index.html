<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ee4134" />
  <title>Hungry Birds Cafe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand"><span class="logo">HB</span><div><small>Cafe & Kitchen</small><h1>Hungry Birds</h1></div></div>
      <a class="phone" href="tel:9460783298">☎</a>
    </header>
    <div class="delivery">🚚 Home delivery available <strong>Delivery charge ₹30</strong></div>
    <section class="hero"><small>FAST • FRESH • TASTY</small><h2>Order your favorite bites</h2><button data-scroll="menu">Order now</button></section>
    <section class="section" id="menu">
      <div class="section-title"><h3>Our menu</h3><span>₹ Indian prices</span></div>
      <div class="chips"><button class="active" data-category="all">All</button><button data-category="maggie">Maggie</button><button data-category="pizza">Pizza</button><button data-category="burger">Burger</button><button data-category="sandwich">Sandwich</button><button data-category="coffee">Coffee</button><button data-category="shakes">Shakes</button></div>
      <div id="menu-items" class="menu-list"></div>
    </section>
    <section class="cart section"><div class="section-title"><h3>Your cart</h3><span id="count">0 items</span></div><div id="cart-items"><p class="empty">Add something delicious from the menu.</p></div><div class="total"><span>Total including ₹30 delivery</span><strong id="total">₹30</strong></div><button id="checkout">Checkout</button></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
